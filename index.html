<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Wacut_e | Dashboard Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow-lg">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <img src="https://w7.pngwing.com/pngs/147/111/png-transparent-dragon-red-dragon-legendary-creature-dragon-fire.png" alt="Logo" class="logo-img me-2">
            <span class="fw-bold ms-2">WACUT_E</span>
        </a>
        <div id="postCounter" class="badge rounded-pill bg-danger">المقالات: 0</div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-lg-4 mb-4">
            <div class="glass-card p-4 text-center">
                <img src="https://w7.pngwing.com/pngs/351/10/png-transparent-dragon-art-dragon-dragon-legendary-creature-dragon-fictional-character.png" class="side-dragon-img mb-3" alt="Dragon">
                <h5 class="mb-4 text-warning fw-bold">أنشئ مقالاً جديداً</h5>
                <input type="text" id="postTitle" class="form-control mb-3" placeholder="عنوان المقال..">
                <textarea id="postContent" class="form-control mb-3" rows="5" placeholder="اكتب أفكارك هنا.."></textarea>
                <button onclick="handlePublish()" class="btn btn-warning w-100 fw-bold py-2 shadow">نشر المقال <i class="fas fa-fire ms-1"></i></button>
            </div>
        </div>
        
        <div class="col-lg-8">
            <div id="articlesArea">
                </div>
        </div>
    </div>
</div>

<footer class="text-center mt-5 py-5 border-top border-secondary">

        <a href="https://www.instagram.com/wacut_e?igsh=bHEyaTdhb3owYWdj" target="_blank" class="social-icon"><i class="fab fa-instagram"></i></a>
